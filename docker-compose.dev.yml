services:
  mongo:
    image: mongo:7
    container_name: whisper-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-dev:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whisper-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: whisper-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.dev
    environment:
      MONGO_URL: "mongodb://mongo:27017/whisper"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./backend/src:/usr/src/app/src
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data-dev:
  redis-data-dev:
