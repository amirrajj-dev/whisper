services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_SOCKET_URL: "/"
    container_name: whisper-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: whisper-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      CORS_ORIGIN: "${DOMAIN:-http://localhost:4000}"
      FRONTEND_URL: "${DOMAIN:-http://localhost:4000}"

  nginx:
    image: nginx:alpine
    container_name: whisper-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
